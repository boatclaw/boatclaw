name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for version bump
        id: check
        run: |
          # Get the latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)

          # Check if it's a release-worthy commit
          if [[ "$COMMIT_MSG" =~ ^feat|^fix|^perf ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT

            if [[ "$COMMIT_MSG" =~ ^feat\! ]] || [[ "$COMMIT_MSG" =~ BREAKING ]]; then
              echo "bump=major" >> $GITHUB_OUTPUT
            elif [[ "$COMMIT_MSG" =~ ^feat ]]; then
              echo "bump=minor" >> $GITHUB_OUTPUT
            else
              echo "bump=patch" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump version without git tag (we'll create release manually)
          NEW_VERSION=$(npm version ${{ steps.check.outputs.bump }} --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Commit the version bump
          git add package.json package-lock.json
          git commit -m "chore: release $NEW_VERSION [skip ci]"
          git push

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true

      - name: Publish to npm
        if: steps.check.outputs.should_release == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
